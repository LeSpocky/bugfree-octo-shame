---
stages:          # List of stages for jobs, and their order of execution
  - build
  - test

default:         # Add a default section to define the `image` keyword's default value
  image: debian:13
  # TODO  Use a container prepared with the necessary build environment!
  before_script:
    - apt update -qq && apt install -y -qq build-essential cmake libboost-dev libboost-system-dev libboost-thread-dev

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  parallel:
    matrix:
      - CMAKE_BUILD_TYPE: ["Debug","RelWithDebInfo"]
        WITH_BOOST: ["ON","OFF"]
  cache:
    key: "${CI_PIPELINE_ID}_${CMAKE_BUILD_TYPE}_${WITH_BOOST}"
    paths:
      - build/
    policy: push
  script:
    - mkdir -p build
    - cmake -S . -B ./build 
      -DCMAKE_CXX_FLAGS='-Wall -Wextra' -DCMAKE_C_FLAGS='-Wall -Wextra'
      -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DWITH_BOOST:BOOL=$WITH_BOOST
    - cmake --build ./build

unit-test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  parallel:
    matrix:
      - CMAKE_BUILD_TYPE: ["Debug","RelWithDebInfo"]
        WITH_BOOST: ["OFF"]
  needs:
    - job: build-job
      parallel:
        matrix:
          - CMAKE_BUILD_TYPE: ["Debug","RelWithDebInfo"]
            WITH_BOOST: ["OFF"]
  cache:
    key: "${CI_PIPELINE_ID}_${CMAKE_BUILD_TYPE}_${WITH_BOOST}"
    paths:
      - build/
    policy: pull
  script:
    - ctest --output-on-failure --output-junit junit.xml --test-dir ./build
  artifacts:
    when: always
    paths:
      - build/junit.xml
    reports:
      junit: build/junit.xml
